---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before cloning the repository.
  workspaces:
    - name: source

  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu

        echo "Removing all files from $(workspaces.source.path) ..."

        if [ -d "$(workspaces.source.path)" ]; then
          rm -rf "$(workspaces.source.path)"/*
          rm -rf "$(workspaces.source.path)"/.[!.]*
          rm -rf "$(workspaces.source.path)"/..?*
        fi

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  description: Run Python linting with flake8.
  workspaces:
    - name: source

  params:
    - name: args
      description: Arguments passed to flake8.
      type: string
      default: "service tests --count --select=E9,F63,F7,F82 --show-source --statistics"

  steps:
    - name: lint
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        echo "Installing Python dependencies..."
        pip install --disable-pip-version-check -r requirements.txt

        echo "Running flake8..."
        python -m flake8 $(params.args)

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  description: Run Python unit tests with Nose.
  workspaces:
    - name: source

  params:
    - name: args
      description: Arguments passed to Nose.
      type: string
      default: "-v"

  steps:
    - name: test
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        echo "Installing Python dependencies..."
        pip install --disable-pip-version-check -r requirements.txt

        echo "Running unit tests..."

        python - $(params.args) <<'PY'
        import collections
        import collections.abc
        import sys

        # Compatibility adjustments for Nose 1.3.7 on Python 3.11.
        compatibility_names = [
            "Callable",
            "Mapping",
            "MutableMapping",
            "Sequence",
        ]

        for name in compatibility_names:
            if not hasattr(collections, name):
                setattr(collections, name, getattr(collections.abc, name))

        import nose

        nose.run_exit(argv=["nosetests"] + sys.argv[1:])
        PY