apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: ci-cd-pipeline-run-
spec:
  pipelineRef:
    name: ci-cd-pipeline

  params:
    - name: repo-url
      value: https://github.com/WillsMd/ci-cd-final-project.git

    - name: app-name
      value: oc-lab-app

    - name: build-image
      value: image-registry.openshift-image-registry.svc:5000/sn-labs-williammdemu/oc-lab-app:latest

  workspaces:
    - name: output
      persistentVolumeClaim:
        claimName: oc-lab-pvc